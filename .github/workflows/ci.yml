name: CI
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run ruff check scripts/agent_protocol.py scripts/generate_claude_settings.py scripts/proxy_security.py nextorca tests evals
      - name: Compile proxy modules
        run: uv run python -m py_compile scripts/proxy.py scripts/proxy_security.py nextorca/*.py
      - name: Check shell syntax
        run: |
          for script in scripts/setup.sh scripts/analyze.sh scripts/test_single.sh scripts/start_services.sh; do
            bash -n "$script"
          done
      - run: uv run nextorca --help
      - run: uv run python evals/evaluate_routing.py --fail-under 0.95
      - run: uv run pytest
