name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run ruff check scripts/agent_protocol.py scripts/generate_claude_settings.py tests
      - run: bash -n scripts/setup.sh scripts/analyze.sh scripts/test_single.sh scripts/start_services.sh
      - run: uv run pytest
