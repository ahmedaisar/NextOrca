name: CI
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - name: Install Linux sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --version
          bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / /usr/bin/true
      - run: uv sync --extra dev
      - run: uv run python -c "from importlib.metadata import version; assert version('nextorca') == '0.8.0'"
      - run: uv run ruff check scripts/agent_protocol.py scripts/generate_claude_settings.py scripts/proxy_security.py nextorca tests evals
      - name: Compile proxy modules
        run: uv run python -m py_compile scripts/proxy.py scripts/proxy_security.py nextorca/*.py
      - name: Check shell syntax
        run: |
          for script in scripts/setup.sh scripts/analyze.sh scripts/test_single.sh scripts/start_services.sh; do
            bash -n "$script"
          done
      - run: uv run nextorca --help
      - run: uv run python evals/evaluate_routing.py --fail-under 0.95
      - run: uv run pytest
