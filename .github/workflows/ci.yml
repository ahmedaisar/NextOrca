name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install development dependencies
        run: uv sync --extra dev
      - name: Validate package metadata
        run: uv run python -c "from importlib.metadata import version; assert version('nextorca') == '0.8.0'"
      - name: Lint
        run: uv run ruff check nextorca tests evals examples
      - name: Compile Python packages
        run: uv run python -m compileall -q nextorca examples evals
      - name: CLI smoke test
        run: uv run nextorca --help
      - name: Benchmark manifest and offline smoke
        run: |
          uv run python -c "from pathlib import Path; from evals.benchmark import load_manifest; version, tasks = load_manifest(Path('evals/benchmark_tasks.json')); assert len(tasks) >= 6"
          uv run python -m evals.run_benchmark --smoke --output-dir "$RUNNER_TEMP/nextorca-eval-smoke"
      - name: Unit and integration tests (sandbox-dependent tests skip when unavailable)
        run: uv run pytest

  comprehensive:
    name: Comprehensive validation
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install Linux sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --version
          bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / /usr/bin/true
      - name: Install development dependencies
        run: uv sync --extra dev
      - name: Validate package metadata
        run: uv run python -c "from importlib.metadata import version; assert version('nextorca') == '0.8.0'"
      - name: Lint
        run: uv run ruff check nextorca tests evals examples
      - name: Compile Python packages
        run: uv run python -m compileall -q nextorca examples evals
      - name: CLI smoke test
        run: uv run nextorca --help
      - name: Routing evaluation
        run: uv run python evals/evaluate_routing.py --fail-under 0.95
      - name: Full test suite and fixture matrix
        env:
          NEXTORCA_FULL_BENCHMARK_TESTS: "1"
        run: uv run pytest
